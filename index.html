<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Mapa Personalizado</title>
    
    <!-- Librería de mapas Leaflet (Corregida) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com"></script>
    
    <!-- Librerías oficiales de Firebase (Corregidas) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        .controls { padding: 12px; background: #2c3e50; color: white; text-align: center; font-size: 14px; z-index: 10; }
        
        /* Formulario flotante para crear el punto */
        #formulario-punto { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; color: #333; padding: 20px; border-radius: 8px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3); z-index: 2000; width: 280px;
        }
        #formulario-punto h3 { margin-top: 0; font-size: 16px; color: #2c3e50; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; }
        .btn-cancel { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; font-size: 12px; }
        
        /* Estilos dentro de la burbuja del mapa */
        .popup-container { max-width: 180px; font-size: 13px; }
        .popup-img { width: 100%; height: auto; border-radius: 5px; margin-top: 6px; display: block; }
        .popup-date { color: #7f8c8d; font-size: 11px; margin-bottom: 4px; }
        .popup-desc { font-style: italic; color: #34495e; margin-top: 4px; word-break: break-word; }
    </style>
</head>
<body>

    <div class="controls">
        <b>📌 Instrucciones:</b> Toca cualquier lugar del mapa para marcar un nuevo punto.
        <p id="status" style="font-size: 11px; margin: 4px 0 0 0; color: #bdc3c7;">Conectando...</p>
    </div>

    <div id="map"></div>

    <!-- Formulario flotante -->
    <div id="formulario-punto">
        <h3>Añadir Nuevo Rincón</h3>
        <div class="form-group">
            <label>1. Tipo de Marcador</label>
            <select id="form-tipo">
                <option value="blue">🔵 Azul (General)</option>
                <option value="red">🔴 Rojo (Favorito)</option>
                <option value="green">🟢 Verde (Naturaleza)</option>
                <option value="orange">🟠 Naranja (Restaurantes / Fiesta)</option>
            </select>
        </div>
        <div class="form-group">
            <label>2. Descripción de la foto</label>
            <textarea id="form-desc" rows="2" placeholder="¿Qué pasó aquí?..."></textarea>
        </div>
        <div class="form-group">
            <label>3. Seleccionar Foto</label>
            <input type="file" accept="image/*" id="form-foto">
        </div>
        <button class="btn-submit" onclick="enviarPuntoAFirebase()">Guardar y Compartir</button>
        <button class="btn-cancel" onclick="cerrarFormulario()">Cancelar</button>
    </div>

    <script>
        // CONFIGURACIÓN DE TU PROYECTO DE FIREBASE (Rellena con tus datos)
        const firebaseConfig = {
    		apiKey: "AIzaSyCOmfNrSQy130-qLwTPzDY35AU3fDyuHPI",
    		authDomain: "ubiart-2f890.firebaseapp.com",
    		databaseURL: "https://ubiart-2f890-default-rtdb.europe-west1.firebasedatabase.app",
    		projectId: "ubiart-2f890",
    		storageBucket: "ubiart-2f890.firebasestorage.app",
    		messagingSenderId: "1042731218066",
    		appId: "1:1042731218066:web:36f2ed693ddeaae33ea24b"
  	};

        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Control de clave de acceso en el dispositivo
        let miClaveSecreta = localStorage.getItem('clave_mapa');
        if (!miClaveSecreta) {
            miClaveSecreta = prompt("Introduce la clave del mapa compartido:");
            if (miClaveSecreta) localStorage.setItem('clave_mapa', miClaveSecreta);
        }

        // Inicializar Mapa centrado por defecto en coordenadas globales
        let map = L.map('map').setView([40.4167, -3.7037], 6); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let coordenadasSeleccionadas = null;

        // Generador de iconos de colores reales usando marcadores web estables
        function obtenerIconoColor(color) {
            let urlColor = "blue";
            if (color === "red") urlColor = "red";
            if (color === "green") urlColor = "green";
            if (color === "orange") urlColor = "orange";
            
            return new L.Icon({
                iconUrl: `https://githubusercontent.com{urlColor}.png`,
                shadowUrl: 'https://cloudflare.com',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });
        }

        // ESCUCHAR CLIC EN EL MAPA
        map.on('click', function(e) {
            coordenadasSeleccionadas = e.latlng;
            document.getElementById('formulario-punto').style.display = 'block';
        });

        function cerrarFormulario() {
            document.getElementById('formulario-punto').style.display = 'none';
            document.getElementById('form-desc').value = '';
            document.getElementById('form-foto').value = '';
            coordenadasSeleccionadas = null;
        }

        // Enviar todos los datos recolectados hacia Firebase
        function enviarPuntoAFirebase() {
            const tipo = document.getElementById('form-tipo').value;
            const descripcion = document.getElementById('form-desc').value;
            const fotoInput = document.getElementById('form-foto').files[0];

            if (!fotoInput) {
                alert("Por favor, selecciona una foto para este punto.");
                return;
            }

            document.getElementById('status').innerText = "Subiendo punto...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;

                database.ref('puntos compartidos').push({
                    lat: coordenadasSeleccionadas.lat,
                    lng: coordenadasSeleccionadas.lng,
                    tipo: tipo,
                    descripcion: descripcion,
                    foto: base64Image,
                    fecha: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }),
                    clave: miClaveSecreta 
                }).then(() => {
                    document.getElementById('status').innerText = "¡Punto añadido con éxito!";
                    cerrarFormulario();
                }).catch(() => {
                    alert("Error de permisos. Verifica la contraseña secreta.");
                    localStorage.removeItem('clave_mapa');
                });
            };
            reader.readAsDataURL(fotoInput);
        }

        // Función para pintar los pines según su color y rellenar la burbuja
        function crearMarcador(punto) {
            const iconoColor = obtenerIconoColor(punto.tipo || 'blue');
            
            const popupContenido = `
                <div class="popup-container">
                    <div class="popup-date">📅 ${punto.fecha}</div>
                    <div class="popup-desc">${punto.descripcion || 'Sin descripción.'}</div>
                    <img src="${punto.foto}" class="popup-img" />
                </div>
            `;
            
            L.marker([punto.lat, punto.lng], { icon: iconoColor }).addTo(map).bindPopup(popupContenido);
        }

        // Sincronización en tiempo real con Firebase
        database.ref('puntos compartidos')
            .orderByChild('clave')
            .equalTo(miClaveSecreta)
            .on('child_added', (snapshot) => {
                const nuevoPunto = snapshot.val();
                crearMarcador(nuevoPunto);
                document.getElementById('status').innerText = "Mapa sincronizado y al día.";
            }, () => {
                document.getElementById('status').innerText = "Error: Acceso denegado o clave incorrecta.";
            });
    </script>
</body>
</html>
